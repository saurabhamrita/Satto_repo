name: Saurabhpipeline
on:
   push:
    branches:  
      - main
      - feature
   pull_request:
    branches: 
      - main
      - feature

  
   workflow_dispatch:
permissions: 
  id-token: write
  contents: read
  
env:
  TF_VERSION : "1.8.5"

jobs:
  terrfrom_plan : 
    name : terraform plan
    runs-on : ubuntu-latest
    steps : 
      - name : checkout
        uses : ctions/checkout@v7.0.0

      - name : HashiCorp - Setup Terraform
        uses : hashicorp/setup-terraform@v2.0.3
        with : 
          terraform_version : latest
          
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 


